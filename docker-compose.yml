version: '3.8'

services:
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: videodrop-worker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - WORKER_PORT=8080
      - WORKER_HOST=0.0.0.0
      - DOWNLOADER_API_KEY=dev-secret-api-key-12345
      - MAX_CONCURRENT_JOBS=2
      - JOB_TTL_MINUTES=30
      - RATE_LIMIT_ANALYZE=20
      - RATE_LIMIT_DOWNLOAD=10
      - TEMP_STORAGE_DIR=/tmp/video-downloader
    volumes:
      - worker-tmp:/tmp/video-downloader
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: videodrop-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DOWNLOADER_API_URL=http://worker:8080
      - DOWNLOADER_API_KEY=dev-secret-api-key-12345
    depends_on:
      worker:
        condition: service_healthy

volumes:
  worker-tmp:
